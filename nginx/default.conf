# Empty keys exempt page views, static files, and authenticated dashboard actions.
# request_uri stays unchanged when Laravel internally rewrites to index.php.
map "$request_method:$request_uri" $public_post_ip {
    default "";
    ~^POST:/(enquire|currency|login|logout)/?(\?|$) $binary_remote_addr;
}
limit_req_zone $public_post_ip zone=public_posts:10m rate=1r/s;

server {
    listen 80;
    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 55M;
    server_name localhost;
    root /var/www/html/public; # Adjust to your framework's entry point

    index index.php index.html;

    limit_req zone=public_posts burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @public_post_limited;

    location @public_post_limited {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"message":"Too many requests. Please wait 2 seconds before trying again.","retry_after":2}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(enquire|currency|login|logout)/?$ {
        client_max_body_size 32k;
        try_files $uri /index.php?$query_string;
    }

    # Uploaded media is always static; no uploaded script reaches PHP-FPM.
    location ^~ /storage/ {
        if ($uri !~* "\.(jpe?g|png|webp|gif|bmp|avif|mp4|webm)$") { return 404; }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(env|ini|log|sql|bak|backup)$ { deny all; }

    location = /index.php {
        try_files $uri =404;
        fastcgi_pass app:9000; # Routes to your PHP-FPM container
        fastcgi_index index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 404; }
}
