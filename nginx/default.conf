# Empty keys exempt page views, static files, and authenticated dashboard actions.
# request_uri stays unchanged when Laravel internally rewrites to index.php.
map "$request_method:$request_uri" $public_post_ip {
    default "";
    ~^POST:/(enquire|currency|login|logout)/?(\?|$) $binary_remote_addr;
}
limit_req_zone $public_post_ip zone=public_posts:10m rate=1r/s;

server {
    listen 80;
    client_max_body_size 55M;
    server_name localhost;
    root /var/www/html/public; # Adjust to your framework's entry point

    index index.php index.html;

    limit_req zone=public_posts burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @public_post_limited;

    location @public_post_limited {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"message":"Too many requests. Please wait 2 seconds before trying again.","retry_after":2}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000; # Routes to your PHP-FPM container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
