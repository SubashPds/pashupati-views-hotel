services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: departmental-dashboard-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      postgres: 
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - departmental_dashboard_command
 
  nginx:
    image: nginx:1.27-alpine
    container_name: departmental-dashboard-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/html/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - departmental_dashboard_command
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.supervisord
      args:
        SUPERVISORD: supervisord
    container_name: departmental-dashboard-supervisord
    restart: always
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/var/www/html
      - ./supervisord/supervisord.conf:/etc/supervisord.conf
    networks:
      - departmental_dashboard_command
  redis:
    image: redis:latest
    restart: always
    container_name: departmental-dashboard-command-redis
    ports:
      - "6384:6379"
    volumes:
      - redis_data:/data
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - departmental_dashboard_command
  postgres:
    image: postgres:latest
    container_name: departmental-dashboard-command-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: departmental_dashboard_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d departmental_dashboard_local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - departmental_dashboard_command

volumes:
  redis_data:
  postgres_data:

networks:
  departmental_dashboard_command:

