services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pashupati-views-hotel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      postgres: 
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pashupati-views-hotel-network
 
  nginx:
    image: nginx:1.27-alpine
    container_name: pashupati-views-hotel-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/html/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pashupati-views-hotel-network

volumes:
  redis_data:
  postgres_data:

networks:
  pashupati-views-hotel-network:

